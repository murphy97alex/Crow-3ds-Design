name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create this tag (e.g. v0.0.1) on the selected commit and publish a release"
        required: false
        default: ""

permissions:
  contents: write # needed to publish releases on tags

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libpng
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpng-dev
      - name: Host tests (file formats, undo, tools, selection, import / export, settings, input, loader fuzz)
        run: make test

  build:
    needs: test
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Install helper packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl jq unzip file ca-certificates git

      - uses: actions/checkout@v4

      - name: Fetch bannertool + makerom
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/fetch-tools.sh
          echo "$PWD/tools/bin" >> "$GITHUB_PATH"

      - name: Build .3dsx
        run: make -j"$(nproc)"

      - name: Build .cia
        run: make cia

      - name: Collect outputs
        run: |
          mkdir -p dist
          cp pixel-crow.3dsx pixel-crow.cia dist/
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: pixel-crow-${{ github.sha }}
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/pixel-crow.3dsx
            dist/pixel-crow.cia
          generate_release_notes: true
