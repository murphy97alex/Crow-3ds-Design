name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Install helper packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl jq unzip file ca-certificates git

      - uses: actions/checkout@v4

      - name: Fetch bannertool + makerom
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/fetch-tools.sh
          echo "$PWD/tools/bin" >> "$GITHUB_PATH"

      - name: Build .3dsx
        run: make -j"$(nproc)"

      - name: Build .cia
        run: make cia

      - name: Collect outputs
        run: |
          mkdir -p dist
          cp pixel-ui-designer.3dsx pixel-ui-designer.cia dist/
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: pixel-ui-designer-${{ github.sha }}
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pixel-ui-designer.3dsx
            dist/pixel-ui-designer.cia
          generate_release_notes: true
