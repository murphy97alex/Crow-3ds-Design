name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create this tag (e.g. v0.0.1) on the selected commit and publish a release"
        required: false
        default: ""

permissions:
  contents: write # needed to publish releases on tags

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libpng
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpng-dev
      - name: Host tests (file format, layers, undo, tools, selection, PNG, frames, GIF)
        run: |
          F="-Wall -Wextra -Werror -fsanitize=address,undefined -g -I/usr/include/libpng16 -I source"
          cc $F tests/test_pxd.c source/pxd.c source/doc.c -o test_pxd && ./test_pxd
          cc $F tests/test_layers.c source/pxd.c source/doc.c -o test_layers && ./test_layers
          cc $F tests/test_tools.c source/tools.c source/doc.c -lm -o test_tools && ./test_tools
          cc $F tests/test_select.c source/select.c source/export_png.c source/stamps.c source/pxd.c source/doc.c -lz -lm -o test_select && ./test_select
          cc $F tests/test_text.c source/text.c source/fonts_data.c -o test_text && ./test_text
          cc $F tests/test_import.c source/import.c source/export_png.c source/pxd.c source/doc.c -lpng16 -lz -lm -o test_import && ./test_import
          cc $F tests/test_frames.c source/pxd.c source/doc.c -o test_frames && ./test_frames
          cc $F tests/test_anim.c source/anim.c source/export_png.c source/import.c source/doc.c -lpng16 -lz -lm -o test_anim && ./test_anim

  build:
    needs: test
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Install helper packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl jq unzip file ca-certificates git

      - uses: actions/checkout@v4

      - name: Fetch bannertool + makerom
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/fetch-tools.sh
          echo "$PWD/tools/bin" >> "$GITHUB_PATH"

      - name: Build .3dsx
        run: make -j"$(nproc)"

      - name: Build .cia
        run: make cia

      - name: Collect outputs
        run: |
          mkdir -p dist
          cp pixel-crow.3dsx pixel-crow.cia dist/
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: pixel-crow-${{ github.sha }}
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/pixel-crow.3dsx
            dist/pixel-crow.cia
          generate_release_notes: true
